;align-items:center;gap:5px;padding:6px 9px;background:#eaf5f6;border-radius:20px;font-size:12px}.toggle{display:flex;align-items:center;gap:8px}.toggle input{width:auto}.weekgrid{display:grid;gap:8px}.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);z-index:60;background:var(--navy);color:white;padding:12px 16px;border-radius:12px;font-size:13px;box-shadow:0 4px 18px #0002}.avatar-options{display:flex;gap:8px;flex-wrap:wrap}.avatar-options button{font-size:26px;background:#eaf7f7;padding:10px;border-radius:12px}.avatar-options button.selected{outline:3px solid var(--teal).divider{height:1px;background:var(--line);margin:12px 0}.header-logo{max-width:200px;max-height:90px;object-fit:contain;background:white;border-radius:10px}.monthrow{display:flex;gap:8px;align-items:center;margin-bottom:12px}.monthrow select{flex:1}.balance{font-size:19px;font-weight:800}.config{display:grid;gap:10px}.muted{color:var(--muted)}

const $=id=>document.getElementById(id), WEEK=['Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira'];const NAV=[['home','⌂','Hoje'],['students','♧','Alunos'],['calendar','▦','Agenda'],['payments','R$','Pagamentos'],['replacement','↻','Reposição'],['notify','✉','Avisos'],['teachers','♙','Professor']];
const defaultState={students:[],teachers:[],lessons:[],payments:[],notifications:[],replacements:[],settings:{senderPhone:'',teacherName:'Profª MALU',school:'MIZU Natação Infantil'},autoLog:[]};let state=loadState();let active='home',calendarTab='today',paymentMonth=new Date().toISOString().slice(0,7),studentFilter='all',studentQuery='';
function loadState(){try{return {...defaultState,...JSON.parse(localStorage.getItem('mizu-v1')||'{}')}}catch{return structuredClone(defaultState)}}function save(){localStorage.setItem('mizu-v1',JSON.stringify(state));render()}function toast(m){let el=document.createElement('div');el.className='toast';el.textContent=m;document.body.append(el);setTimeout(()=>el.remove(),2500)}function id(){return Math.random().toString(36).slice(2,10)}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmtMoney(n){return Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}function dateISO(d=new Date()){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}function dayName(date){return WEEK[new Date(date+'T12:00:00').getDay()-1]||''}function nav(){ $('nav').innerHTML=NAV.map(([k,i,t])=>`<button class="${active===k?'active':''}" onclick="go('${k}')"><span class="ico">${i}</span>${t}</button>`).join('')}function go(k){active=k;render()}function pageHead(title,subtitle,action=''){return `<div class="page-head"><div><h1>${title}</h1><p>${subtitle||''}</p></div>${action}</div>`}
function render(){nav();let views={home:homeView,students:studentsView,calendar:calendarView,payments:paymentsView,replacement:replacementView,notify:notifyView,teachers:teachersView};$('view').innerHTML=views[active]();}
function homeView(){let paid=state.payments.filter(p=>p.status==='paid'),pending=state.payments.filter(p=>p.status!=='paid'),today=dateISO(),todaysLessons=state.lessons.filter(l=>l.day===dayName(today));let semPaid=paid.filter(p=>p.period==='semester').reduce((s,p)=>s+Number(p.amount||0),0),monthPaid=paid.filter(p=>p.period==='month').reduce((s,p)=>s+Number(p.amount||0),0),pendSum=pending.reduce((s,p)=>s+Number(p.amount||0),0);return `${pageHead('Visão geral',new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'}),`<button class="btn primary" onclick="openStudent()">＋ Aluno</button>`)}<div class="cards"><div class="card stat"><div class="label">Alunos ativos</div><div class="value">${state.students.filter(s=>s.status!=='inactive').length}</div></div><div class="card stat"><div class="label">Recebido no mês</div><div class="value">${fmtMoney(monthPaid)}</div><div class="hint">Confirmado</div></div><div class="card stat"><div class="label">Recebido semestral</div><div class="value">${fmtMoney(semPaid)}</div><div class="hint">Pagamento único confirmado</div></div><div class="card stat"><div class="label">Pendências</div><div class="value">${fmtMoney(pendSum)}</div><div class="hint">${pending.length} registro(s)</div></div></div><section class="panel"><div class="section-title">Alertas do dia</div>${dueAlertView()}<div class="small">Os alertas automáticos são atualizados quando o app é aberto. O iOS não permite ao protótipo HTML offline disparar WhatsApp ou notificações agendadas com o app fechado.</div></section><section class="panel" style="margin-top:12px"><div class="section-title">Aulas de hoje</div>${lessonList(todaysLessons)}</section><section class="panel" style="margin-top:12px"><div class="section-title">Últimos recebimentos</div>${recentPaymentView()}</section>`}
function dueAlertView(){let today=dateISO(),pending=state.payments.filter(p=>p.status!=='paid'&&p.due),todayList=pending.filter(p=>p.due===today),overdue=pending.filter(p=>p.due<today),renew=state.notifications.filter(n=>n.type==='Renovação semestral automática'&&n.date===today);if(!pending.length&&!renew.length)return `<div class="empty">Nenhum vencimento ou renovação para hoje.</div>`;return `<div class="stack">${todayList.map(p=>`<div class="notice red"><strong>${p.period==='semester'?'Renovação semestral vence hoje:':'Mensalidade vence hoje:'}</strong> ${studentName(p.studentId)} • ${fmtMoney(p.amount)}<div class="row wrap"><button class="btn primary sm" onclick="whatsPayment('${p.id}')">WhatsApp</button><button class="btn soft sm" onclick="markPaid('${p.id}')">Confirmar recebimento</button></div></div>`).join('')}${overdue.map(p=>`<div class="notice"><strong>${p.period==='semester'?'Semestral pendente:':'Mensalidade pendente:'}</strong> ${studentName(p.studentId)} • ${fmtMoney(p.amount)} • venc. ${fmtDate(p.due)} <button class="btn soft sm" onclick="markPaid('${p.id}')">Confirmar recebimento</button></div>`).join('')}${renew.map(n=>`<div class="notice">Renovação semestral: ${esc(n.message)} <button class="btn outline sm" onclick="reopenNotice('${n.id}')">WhatsApp</button></div>`).join('')}</div>`}
function lessonList(lessons){if(!lessons.length)return `<div class="empty">Nenhuma aula cadastrada para este dia.</div>`;return `<div class="stack">${lessons.sort((a,b)=>a.time.localeCompare(b.time)).map(l=>`<div class="lesson"><div class="lesson-time">${esc(l.time)}</div><div class="lesson-info"><b>${esc(l.title||'Aula particular')}</b><div class="item-sub">${lessonStudents(l)}${l.cancelled?` • <span class="badge cancelled">Cancelada (${esc(l.cancelBy)})</span>`:''}</div><div class="lesson-actions">${!l.cancelled?`<button class="btn outline sm" onclick="cancelLesson('${l.id}')">Cancelar</button>`:`<button class="btn soft sm" onclick="restoreLesson('${l.id}')">Reativar</button>`}<button class="btn outline sm" onclick="editLesson('${l.id}')">Editar</button></div></div></div>`).join('')}</div>`}

function avatarUrl(emoji){let svg=`<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><rect width='100' height='100' rx='50' fill='#e4f5f5'/><text x='50' y='66' text-anchor='middle' font-size='58'>${emoji}</text></svg>`;return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(svg)}
function openStudent(studentId=''){let s=state.students.find(x=>x.id===studentId)||{name:'',age:'',level:'',guardian:'',address:'',plan:'Mensal',period:'month',price:'',method:'PIX',dueDay:'10',day:'',time:'',status:'active',shared:false,sharedIds:[],avatar:'🐠',photo:'',notes:'',phone:''};let selectedAvatar=s.avatar||'🐠';$('modalRoot').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="modalbox"><div class="modalhead"><h2>${studentId?'Editar aluno':'Cadastrar aluno'}</h2><button class="close" onclick="closeModal()">✕</button></div><form class="gridform" onsubmit="saveStudent(event,'${studentId}')"><div class="field full"><label>Nome do aluno *</label><input id="fName" value="${esc(s.name)}" required></div><div class="field"><label>Idade</label><input id="fAge" type="number" min="0" value="${esc(s.age)}"></div><div class="field"><label>Nível de natação</label><select id="fLevel"><option>${esc(s.level||'')}</option><option>Adaptação</option><option>Iniciação</option><option>Intermediário</option><option>Avançado</option></select></div><div class="field"><label>Responsável</label><input id="fGuardian" value="${esc(s.guardian)}"></div><div class="field"><label>Telefone WhatsApp</label><input id="fPhone" type="tel" value="${esc(s.phone||'')}" placeholder="DDD + número"></div><div class="field full"><label>Endereço</label><input id="fAddress" value="${esc(s.address)}"></div><div class="field"><label>Plano</label><input id="fPlan" value="${esc(s.plan)}"></div><div class="field"><label>Modalidade de pagamento</label><select id="fPeriod" onchange="toggleDue()"><option value="month" ${s.period==='month'?'selected':''}>Mensal</option><option value="semester" ${s.period==='semester'?'selected':''}>Semestral (pagamento único)</option></select></div><div class="field"><label>Valor (R$)</label><input id="fPrice" type="number" min="0" step="0.01" value="${esc(s.price)}"></div><div class="field"><label>Forma de pagamento</label><select id="fMetho function toggleDue(){let sem=$('fPeriod')?.value==='semester';$('dueWrap')?.classList.toggle('hidden',sem)}function sharedFields(){$('sharedFields')?.classList.toggle('hidden',!$('fShared').checked)}function chooseAvatar(el,a){window._avatar=a;document.querySelectorAll('.avatar-options button').forEach(x=>x.classList.remove('selected'));el.classList.add('selected')}function saveStudent(e,studentId){e.preventDefault();let sharedIds=$('fShared').checked?Array.from($('fSharedIds').selectedOptions).map(o=>o.value):[];let old=state.students.find(x=>x.id===studentId);let st={id:studentId||id(),name:$('fName').value.trim(),age:$('fAge').value,level:$('fLevel').value,guardian:$('fGuardian').value,phone:$('fPhone').value,address:$('fAddress').value,plan:$('fPlan').value,period:$('fPeriod').value,price:$('fPrice').value,method:$('fMethod').value,dueDay:$('fDueDay')?.value||'1',day:$('fDay').value,time:$('fTime').value,shared:$('fShared').checked,sharedIds,avatar:window._avatar,photo:window._studentTemp.photo||window._oldPhoto,notes:$('fNotes').value,status:$('fInactive').checked?'inactive':'active'};if(old)state.students=state.students.map(x=>x.id===studentId?st:x);else state.students.push(st);if(st.day&&st.time){let linked=[st.id,...st.sharedIds];let found=state.lessons.find(l=>l.day===st.day&&l.time===st.time&&linked.some(id=>l.studentIds.includes(id)));if(!found){state.lessons.push({id:id(),day:st.day,time:st.time,title:'Aula particular',studentIds:linked,cancelled:false})}}closeModal();save();toast('Aluno salvo')}
function openLesson(day,lessonId=''){let l=state.lessons.find(x=>x.id===lessonId)||{day,time:'',title:'Aula particular',studentIds:[],cancelled:false};$('modalRoot').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="modalbox"><div class="modalhead"><h2>${lessonId?'Editar aula':'Adicionar aula'}</h2><button class="close" onclick="closeModal()">✕</button></div><form class="gridform" onsubmit="saveLesson(event,'${lessonId}')"><div class="field"><label>Dia</label><select id="llDay">${WEEK.map(d=>`<option ${l.day===d?'selected':''}>${d}</option>`).join('')}</select></div><div class="field"><label>Horário</label><input type="time" id="llTime" value="${esc(l.time)}" required></div><div class="field full"><label>Nome/descrição</label><input id="llTitle" value="${esc(l.title||'Aula particular')}"></div><div class="field full"><label>Alunos</label><select id="llStudents" multiple size="6">${state.students.filter(s=>s.status!=='inactive').map(s=>`<option value="${s.id}" ${l.studentIds.includes(s.id)?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div><div class="form-actions full"><button type="button" class="btn outline" onclick="closeModal()">Cancelar</button><button class="btn primary">Salvar aula</button></div></form></div></div>`}function saveLesson(e,lessonId){e.preventDefault();let l={id:lessonId||id(),day:$('llDay').value,time:$('llTime').value,title:$('llTitle').value,studentIds:Array.from($('llStudents').selectedOptions).map(o=>o.value),cancelled:false};if(lessonId)state.lessons=state.lessons.map(x=>x.id===lessonId?l:x);else state.lessons.push(l);closeModal();save();toast('Aula salva')}
function cancelLesson(lessonId){let l=state.lessons.find(x=>x.id===lessonId);if(!l)return;let cancelBy=prompt('Quem solicitou o cancelamento? Digite responsável ou professor.','Responsável');if(!cancelBy)return;let valid=cancelBy.toLowerCase().startsWith('p')?'Professor':'Responsável';l.cancelled=true;l.cancelBy=valid;l.cancelledAt=new Date().toISOString();closeModal();save();let ids=l.studentIds||[];ids.forEach(sid=>{let add=confirm(`${studentName(sid)} vai entrar na fila de reposição?`);if(add){state.replacements.push({id:id(),studentId:sid,day:l.day,time:l.time,lessonId:l.id,cancelBy:valid,cancelledAt:l.cancelledAt,status:'waiting'});save()}});toast('Aula cancelada')}
function restoreLesson(lessonId){let l=state.lessons.find(x=>x.id===lessonId);if(l){l.cancelled=false;l.cancelBy='';save();toast('Aula reativada')}}function editLesson(id){openLesson('',id)}function replacementStatus(idv){let r=state.replacements.find(x=>x.id===idv);if(r){r.status=r.status==='waiting'?'placed':'waiting';if(r.status==='placed'){r.placedAt=dateISO();r.placedDay=prompt('Dia da reposição (ex.: quarta-feira):',r.placedDay||'');r.placedTime=prompt('Horário da reposição:',r.placedTime||'')}save()}}function deleteReplacement(idv){state.replacements=state.replacements.filter(x=>x.id!==idv);save()}
function openPayment(paymentId=''){let p=state.payments.find(x=>x.id===paymentId)||{studentId:'',amount:'',period:'month',due:dateISO(),month:paymentMonth,status:'pending',method:'PIX',note:''};$('modalRoot').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="modalbox"><div class="modalhead"><h2>Lançar pagamento</h2><button class="close" onclick="closeModal()">✕</button></div><form class="gridform" onsubmit="savePayment(event,'${paymentId}')"><div class="field full"><label>Aluno</label><select id="ppStudent" required><option value="">Selecione</option>${state.students.filter(s=>s.status!=='inactive').map(s=>`<option value="${s.id}" ${p.studentId===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label>Tipo</label><select id="ppPeriod"><option value="month" ${p.period==='month'?'selected':''}>Mensal</option><option value="semester" ${p.period==='semester'?'selected':''}>Semestral (único)</option></select></div><div class="field"><label>Valor</label><input id="ppAmount" type="number" step="0.01" value="${esc(p.amount)}" required></div><div class="field"><label>Vencimento</label><input id="ppDue" type="date" value="${esc(p.due)}"></div><div class="field"><label>Mês de referência</label><input id="ppMonth" type="month" value="${esc(p.month)}"></div><div class="field"><label>Forma</label><select id="ppMethod"><option>PIX</option><option>Dinheiro</option><option>Cartão</option><option>Transferência</option></select></div><div class="field"><label>Status</label><select id="ppStatus"><option value="pending" ${p.status==='pending'?'selected':''}>Pendente</option><option value="paid" ${p.status==='paid'?'selected':''}>Recebido</option></select></div><div class="field full"><label>Observação</label><input id="ppNote" value="${esc(p.note||'')}"></div><div class="form-actions full"><button type="button" class="btn outline" onclick="closeModal()">Cancelar</button><button class="btn primary">Salvar</butt function markPaid(pid){let p=state.payments.find(x=>x.id===pid);if(p){p.status='paid';p.paidDate=dateISO();save();toast('Recebimento confirmado')}}function markUnpaid(pid){let p=state.payments.find(x=>x.id===pid);if(p){p.status='pending';p.paidDate='';save()}}
function whatsPayment(pid){let p=state.payments.find(x=>x.id===pid),s=state.students.find(x=>x.id===p.studentId);if(!s?.phone){toast('Cadastre telefone do responsável');return}let msg=`Olá${s.guardian?' '+s.guardian:''}! Passando para lembrar que a mensalidade de ${s.name} vence hoje, no valor de ${fmtMoney(p.amount)}. Quando realizar, me confirme por favor. Obrigada!`;openWA(s.phone,msg)}function whatsRenew(sid){let s=state.students.find(x=>x.id===sid);if(!s?.phone){toast('Cadastre telefone do responsável');return}openWA(s.phone,`Olá${s.guardian?' '+s.guardian:''}! Estamos no início de um novo semestre. Vamos renovar a matrícula de ${s.name}?`)}function openWA(phone,msg){let clean=phone.replace(/\D/g,'');window.open(`https://wa.me/${clean}?text=${encodeURIComponent(msg)}`,'_blank')}
function sendManual(e){e.preventDefault();let target=$('nTarget').value,recipients=[];if(target==='all')recipients=state.students.filter(s=>s.status!=='inactive');else if(target==='weekday')recipients=state.students.filter(s=>s.day===$('nDay').value&&s.status!=='inactive');else recipients=Array.from($('nStudents').selectedOptions).map(o=>state.students.find(s=>s.id===o.value)).filter(Boolean);let msg=$('nMessage').value;if(!recipients.length){toast('Nenhum destinatário selecionado');return}let record={id:id(),date:dateISO(),title:'Aviso manual',type:'Manual',message:msg,recipients:recipients.map(s=>s.id),sent:false};state.notifications.push(record);save();closeModal();let first=recipients.find(s=>s.phone);if(first){record.openedIds=[first.id];localStorage.setItem('mizu-v1',JSON.stringify(state));openWA(first.phone,msg);toast(`Aviso salvo para ${recipients.length} destinatários. WhatsApp abre um contato por vez.`)}else toast('Aviso salvo. Cadastre telefone dos responsáveis para WhatsApp')}
function targetChanged(){let v=$('nTarget').value;$('nDayField').classList.toggle('hidden',v!=='weekday');$('nStudentsField').classList.toggle('hidden',v!=='student')}function reopenNotice(nid){let n=state.notifications.find(x=>x.id===nid);if(!n)return;let recipients=(n.recipients||[]).map(sid=>state.students.find(s=>s.id===sid)).filter(Boolean);let next=recipients.find(s=>s.phone&&!((n.openedIds||[]).includes(s.id)));if(!next){toast('Todos os contatos com telefone já foram abertos. Para reenviar, edite o aviso ou crie outro.');return}n.openedIds=n.openedIds||[];n.openedIds.push(next.id);state.notifications=state.notifications.map(x=>x.id===nid?n:x);localStorage.setItem('mizu-v1',JSON.stringify(state));openWA(next.phone,n.message);toast(`Abrindo WhatsApp para ${next.name}. Confirme o envio no WhatsApp.`)}function saveSender(){state.settings.senderPhone=$('senderPhone').value;save();toast('Número de referência salvo')}
function openTeacher(teacherId=''){let t=state.teachers.find(x=>x.id===teacherId)||{name:'',phone:'',main:false};$('modalRoot').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="modalbox"><div class="modalhead"><h2>${teacherId?'Editar professor':'Cadastrar professor'}</h2><button class="close" onclick="closeModal()">✕</button></div><form class="gridform" onsubmit="saveTeacher(event,'${teacherId}')"><div class="field full"><label>Nome</label><input id="tName" value="${esc(t.name)}" required></div><div class="field full"><label>WhatsApp / telefone</label><input id="tPhone" type="tel" value="${esc(t.phone)}" placeholder="DDD + número"></div><div class="field full"><label class="checkrow"><input id="tMain" type="checkbox" ${t.main?'checked':''}> Professor principal / remetente de referência</label></div><div class="form-actions full"><button type="button" class="btn outline" onclick="closeModal()">Cancelar</button><button class="btn primary">Salvar</button></div></form></div></div>`}function saveTeacher(e,teacherId){e.preventDefault();let t={id:teacherId||id(),name:$('tName').value,phone:$('tPhone').value,main:$('tMain').checked};if(t.main)state.teachers.forEach(x=>x.main=false);if(teacherId)state.teachers=state.teachers.map(x=>x.id===teacherId?t:x);else state.teachers.push(t);closeModal();save();toast('Professor salvo')}function deleteTeacher(tid){if(confirm('Excluir professor?')){state.teachers=state.teachers.filter(t=>t.id!==tid);save()}}
function quickShared(){let nm=prompt('Nome do novo aluno que compartilhará a aula:');if(!nm)return;let temp={id:id(),name:nm.trim(),guardian:'',phone:'',age:'',level:'',address:'',plan:'Mensal',period:'month',price:'',method:'PIX',dueDay:'10',day:$('fDay').value,time:$('fTime').value,status:'active',shared:true,sharedIds:[],avatar:'🐬',photo:'',notes:''};state.students.push(temp);let option=document.createElement('option');option.value=temp.id;option.textContent=temp.name;option.selected=true;$('fSharedIds').append(option);save();toast('Aluno adicionado; conclua o cadastro depois')}
function recentPaymentView(){let p=state.payments.filter(x=>x.status==='paid').sort((a,b)=>(b.paidDate||'').localeCompare(a.paidDate||'')).slice(0,4);return p.length?p.map(x=>`<div class="item"><div class="item-main"><div class="item-title">${studentName(x.studentId)}</div><div class="item-sub">${fmtDate(x.paidDate||x.due)} • ${x.period==='semester'?'Semestral':'Mensal'}</div></div><div class="balance">${fmtMoney(x.amount)}</div></div>`).join(''):`<div class="empty">Nenhum recebimento confirmado.</div>`}function studentName(sid){return state.students.find(s=>s.id===sid)?.name||'Aluno removido'}function lessonStudents(l){return (l.studentIds||[]).map(studentName).join(', ')||'Sem alunos'}function fmtDate(d){if(!d)return '—';let parts=d.split('-');return parts.length===3?`${parts[2]}/${parts[1]}/${parts[0]}`:d}
function closeModal(){$('modalRoot').innerHTML=''}function backup(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='mizu-backup-'+dateISO()+'.json';a.click();URL.revokeObjectURL(url)}function restore(e){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let data=JSON.parse(r.result);if(confirm('Restaurar dados do backup? Isso substitui os dados atuais.')){state={...defaultState,...data};save();toast('Backup restaurado')}}catch{toast('Arquivo inválido')}};r.readAsText(file)}
function seedDemo(){if(state.students.length)return;let demo=[{id:'d1',name:'Lia Martins',age:5,level:'Adaptação',guardian:'Ana',phone:'',day:'Segunda-feira',time:'09:00',plan:'2x semana',period:'month',price:'280',dueDay:'10',status:'active',shared:false,sharedIds:[],avatar:'🐢',photo:'',method:'PIX'},{id:'d2',name:'Theo Ribeiro',age:4,level:'Iniciação',guardian:'Marcos',phone:'',day:'Terça-feira',time:'10:30',plan:'1x semana',period:'semester',price:'900',dueDay:'1',status:'active',shared:false,sharedIds:[],avatar:'🐬',photo:'',method:'PIX'},{id:'d3',name:'Bia e Sofia',age:6,level:'Intermediário',guardian:'Carla',phone:'',day:'Quarta-feira',time:'16:00',plan:'Aula compartilhada',period:'month',price:'420',dueDay:'8',status:'active',shared:true,sharedIds:[],avatar:'🐠',photo:'',method:'PIX'}];state.students=demo;state.teachers=[{id:'teacher0',name:'Profª MALU',phone:'',main:true}];let month=dateISO().slice(0,7);state.payments=[{id:'p1',studentId:'d1',period:'month',amount:280,due:month+'-10',month,status:'pending',method:'PIX'},{id:'p2',studentId:'d2',period:'semester',amount:900,due:month+'-01',month,status:'paid',method:'PIX',paidDate:dateISO()}];state.lessons=[{id:'l1',day:'Segunda-feira',time:'09:00',title:'Aula particular',studentIds:['d1'],cancelled:false},{id:'l2',day:'Terça-feira',time:'10:30',title:'Aula particular',studentIds:['d2'],cancelled:false},{id:'l3',day:'Quarta-feira',time:'16:00',title:'Aula compartilhada',studentIds:['d3'],cancelled:false}];state.autoLog=[];save()}
function createDue(){let today=dateISO(),created=0,now=new Date(today+'T12:00:00'),year=now.getFullYear(),month=now.getMonth()+1,lastDay=new Date(year,month,0).getDate();state.students.filter(s=>s.status!=='inactive'&&s.period==='month').forEach(s=>{let day=Math.min(Number(s.dueDay||10),lastDay),dueDate=`${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;if(dueDate<=today&&!state.payments.some(p=>p.studentId===s.id&&p.month===today.slice(0,7))){state.payments.push({id:id(),studentId:s.id,period:'month',amount:s.price||0,due:dueDate,month:today.slice(0,7),status:'pending',method:s.method||'PIX'});created++}});let semester=(month<=6?'1':'2'),termKey=`${year}-${semester}`,semMonth=semester==='1'?'01':'07',semDue=`${year}-${semMonth}-01`;if(month===1||month===7){state.students.filter(s=>s.status!=='inactive'&&s.period==='semester').forEach(s=>{if(!state.payments.some(p=>p.studentId===s.id&&p.period==='semester'&&p.month===termKey)){state.payments.push({id:id(),studentId:s.id,period:'semester',amount:s.price||0,due:semDue,month:termKey,status:'pending',method:s.method||'PIX'});created++}if(!state.notifications.some(n=>n.type==='Renovação semestral automática'&&n.termKey===termKey&&n.recipients?.includes(s.id))){state.notifications.push({id:id(),date:today,termKey,title:'Renovação de matrícula semestral',type:'Renovação semestral automática',message:`Início do semestre ${semester}: lembrar ${s.guardian||'responsável'} sobre renovação da matrícula de ${s.name}.`,recipients:[s.id],sent:false});created++}})}if(created){state.autoLog.push({date:today,created});localStorage.setItem('mizu-v1',JSON.stringify(state))}}
function init(){createDue();render()}
init();
</script></body></html>
